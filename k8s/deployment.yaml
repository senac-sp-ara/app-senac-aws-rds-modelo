apiVersion: apps/v1
kind: Deployment
metadata:
  name: pessoas-service-deployment
  labels:
    app: pessoas-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pessoas-service
  template:
    metadata:
      labels:
        app: pessoas-service
    spec:
      containers:
      - name: pessoas-service-container
        image: 556890483198.dkr.ecr.us-east-2.amazonaws.com/pessoas-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: pessoas-db-secret
              key: DB_HOST
        - name: DB_PORT
          value: "3306"
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: pessoas-db-secret
              key: DB_NAME
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: pessoas-db-secret
              key: DB_USERNAME
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: pessoas-db-secret
              key: DB_PASSWORD
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 40
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 5
